# Builds every pull request and publishes it under
#   https://arealmaas.github.io/how-the-lights-get-in/pr-preview/pr-<number>/
# The action leaves a sticky comment on the PR with the link and removes the preview when the PR is closed.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # previews from forks cannot push to this repository's gh-pages branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Build the preview
        if: github.event.action != 'closed'
        run: sh scripts/assemble-site.sh _site "PR #${{ github.event.number }}"

      - name: Publish or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
