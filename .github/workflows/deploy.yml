# The planner moved to Firebase Hosting. This workflow's only job is to build the move/ page (a single-file
# Vite build into dist-move/) and publish it to the root of gh-pages (clean: true wipes everything else
# there). It is removed once that has run: one final run.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:move
      - name: Publish the moved notice to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist-move
          clean: true
          force: false
          commit-message: "The planner has moved to Firebase Hosting"
