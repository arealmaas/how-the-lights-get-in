# On every push to main: run the app tests, run the Firestore rules tests against the emulator, deploy the
# rules (pinned to the firebase-tools version in firebase/test/package-lock.json, not @latest), then build
# and deploy the site to the live channel. Rules go out tested, and before the site.
name: Deploy on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rules tests (Firestore emulator)
        run: cd firebase/test && npm ci && npm test
      - name: Deploy Firestore rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HTLGI_PLANNER }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase/test/node_modules/.bin/firebase deploy --only firestore:rules --project htlgi-planner --non-interactive
      - name: Build the site
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HTLGI_PLANNER }}
          projectId: htlgi-planner
          channelId: live
