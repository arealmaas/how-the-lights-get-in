# Deploys the site to the live channel and publishes the Firestore rules on every push to main.
name: Deploy on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: sh scripts/assemble-site.sh _site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HTLGI_PLANNER }}
          projectId: htlgi-planner
          channelId: live
      - name: Deploy Firestore rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HTLGI_PLANNER }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@latest deploy --only firestore:rules --project htlgi-planner --non-interactive
