<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The planner has moved</title>
<style>
  body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 20px;color:#17191c;background:#f3f4f1}
  h1{font-size:26px;margin:0 0 12px} p{margin:0 0 14px} a{color:#17191c}
  button{font:inherit;font-weight:600;padding:10px 16px;border:1px solid #17191c;border-radius:8px;background:#17191c;color:#fff;cursor:pointer}
  .small{font-size:13px;color:#555}
</style>
<h1>The planner has moved</h1>
<p>The HowTheLightGetsIn London 2026 planner now lives at <a id="new" href="#"></a>.</p>
<p id="carry" hidden>This browser has picks or notes saved from the old address. Carry them over:</p>
<p id="go" hidden><button type="button" id="btn">Open the new site with my picks and notes</button></p>
<p id="warn" class="small" hidden></p>
<p class="small">If you added the old address to your home screen, remove it and add the new one instead.</p>
<script>// crew-core.js — pure helpers shared by the page (inlined by scripts/build.py at the CORE placeholder) and the
// Node tests in scripts/test/. No DOM, no Firebase: everything here takes plain data and returns plain data.
const CrewCore = (() => {
  'use strict';

  // base64url without padding, UTF-8 safe, available in browsers and Node 18+
  const b64u = {
    encode(str){
      const bytes = new TextEncoder().encode(String(str));
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    decode(param){
      const bin = atob(String(param).replace(/-/g, '+').replace(/_/g, '/'));
      return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
    }
  };

  const isEventKey = k => /^\d+$/.test(k);
  const cleanNotes = obj => Object.fromEntries(Object.entries(obj || {})
    .filter(([no, t]) => isEventKey(no) && typeof t === 'string' && t.trim())
    .map(([no, t]) => [+no, t.slice(0, 20000)]));

  // A note that differs on both sides keeps both texts, mine first, separated by a rule.
  function mergeNoteText(mine, theirs){
    const m = (mine || '').trim(), t = (theirs || '').trim();
    if (!m) return theirs || '';
    if (!t || m === t) return mine;
    if (m.includes(t)) return mine;
    return m + '\n\n---\n\n' + t;
  }

  // Notes travel in a URL fragment as base64url JSON (the move page and #notes= links).
  // The longest notes are dropped first until the parameter fits in maxChars.
  function encodeNotesParam(notes, maxChars = 30000){
    const shortened = Object.values(notes || {}).filter(t => typeof t === 'string' && t.length > 20000).length;
    const entries = Object.entries(cleanNotes(notes)).sort((a, b) => a[1].length - b[1].length);
    const dropped = [];
    while (entries.length) {
      const param = b64u.encode(JSON.stringify(Object.fromEntries(entries)));
      if (param.length <= maxChars) return {param, dropped, shortened};
      dropped.push(+entries.pop()[0]);
    }
    return {param: '', dropped, shortened};
  }
  function decodeNotesParam(param){
    try {
      const obj = JSON.parse(b64u.decode(param));
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return {};
      return cleanNotes(obj);
    } catch (e) { return {}; }
  }

  return {b64u, mergeNoteText, encodeNotesParam, decodeNotesParam};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = CrewCore;
</script>
<script>
(function(){
  // this origin is retired: drop its service worker and caches so an offline load can never resurrect the old planner
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
  const NEW = 'https://htlgi-planner.firebaseapp.com/';
  const a = document.getElementById('new'); a.href = NEW; a.textContent = NEW.replace(/^https:\/\//, '').replace(/\/$/, '');
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const picks = (load('htlgi-l26-picks') || []).filter(n => Number.isInteger(n));
  const verdicts = load('htlgi-l26-verdicts') || {};
  const notes = load('htlgi-l26-notes') || {};
  const hasState = picks.length || Object.keys(verdicts).length || Object.values(notes).some(t => t && t.trim());
  // With no local state, go straight through with the fragment intact; old #event= and #picks= links keep working.
  if (!hasState) { location.replace(NEW + location.hash); return; }
  // someone with local state who arrived via a link: carry the state and keep what the link asked for
  const inc = location.hash.match(/picks=([\d,]*)/);
  if (inc) inc[1].split(',').map(Number).filter(n => Number.isInteger(n) && !picks.includes(n)).forEach(n => picks.push(n));
  const incV = location.hash.match(/verdicts=([^&]+)/);
  const ev = location.hash.match(/event=(\d+)/);
  const {param: p, dropped: droppedList, shortened} = CrewCore.encodeNotesParam(notes, 30000);
  const dropped = droppedList.length;
  const MAX_NOTE = 20000;
  const v = Object.entries(verdicts).map(([no, who]) => no + ':' + encodeURIComponent(who)).join(';');
  const link = NEW + '#picks=' + picks.join(',') + (v ? '&verdicts=' + v : '') + (!v && incV ? '&verdicts=' + incV[1] : '') + (p ? '&notes=' + p : '') + (ev ? '&event=' + ev[1] : '');
  document.getElementById('carry').hidden = false; document.getElementById('go').hidden = false;
  const problems = [];
  if (dropped) problems.push(dropped + ' long note' + (dropped === 1 ? '' : 's') + ' will not fit in the link');
  if (shortened) problems.push(shortened + ' very long note' + (shortened === 1 ? '' : 's') + ' will be shortened to ' + MAX_NOTE + ' characters');
  if (problems.length) { const w = document.getElementById('warn'); w.hidden = false; w.textContent = problems.join('; ') + '; export your notes (.md) from the old planner first if you need them in full.'; }
  document.getElementById('btn').addEventListener('click', () => { location.href = link; });
})();
</script>
</html>
