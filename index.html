<script type="module" crossorigin>//#region \0vite/modulepreload-polyfill.js
(function polyfill() {
	const relList = document.createElement("link").relList;
	if (relList && relList.supports && relList.supports("modulepreload")) return;
	for (const link of document.querySelectorAll("link[rel=\"modulepreload\"]")) processPreload(link);
	new MutationObserver((mutations) => {
		for (const mutation of mutations) {
			if (mutation.type !== "childList") continue;
			for (const node of mutation.addedNodes) if (node.tagName === "LINK" && node.rel === "modulepreload") processPreload(node);
		}
	}).observe(document, {
		childList: true,
		subtree: true
	});
	function getFetchOpts(link) {
		const fetchOpts = {};
		if (link.integrity) fetchOpts.integrity = link.integrity;
		if (link.referrerPolicy) fetchOpts.referrerPolicy = link.referrerPolicy;
		if (link.crossOrigin === "use-credentials") fetchOpts.credentials = "include";
		else if (link.crossOrigin === "anonymous") fetchOpts.credentials = "omit";
		else fetchOpts.credentials = "same-origin";
		return fetchOpts;
	}
	function processPreload(link) {
		if (link.ep) return;
		link.ep = true;
		const fetchOpts = getFetchOpts(link);
		fetch(link.href, fetchOpts);
	}
})();

//#region src/core/notes.js
var b64u = {
	encode(str) {
		const bytes = new TextEncoder().encode(String(str));
		let bin = "";
		for (const b of bytes) bin += String.fromCharCode(b);
		return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
	},
	decode(param) {
		const bin = atob(String(param).replace(/-/g, "+").replace(/_/g, "/"));
		return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
	}
};
var isEventKey = (k) => /^\d+$/.test(k);
var cleanNotes = (obj) => Object.fromEntries(Object.entries(obj || {}).filter(([no, t]) => isEventKey(no) && typeof t === "string" && t.trim()).map(([no, t]) => [+no, t.slice(0, 2e4)]));
function mergeNoteText(mine, theirs) {
	const m = (mine || "").trim(), t = (theirs || "").trim();
	if (!m) return theirs || "";
	if (!t || m === t) return mine;
	if (m.includes(t)) return mine;
	return m + "\n\n---\n\n" + t;
}
function encodeNotesParam(notes, maxChars = 3e4) {
	const shortened = Object.values(notes || {}).filter((t) => typeof t === "string" && t.length > 2e4).length;
	const entries = Object.entries(cleanNotes(notes)).sort((a, b) => a[1].length - b[1].length);
	const dropped = [];
	while (entries.length) {
		const param = b64u.encode(JSON.stringify(Object.fromEntries(entries)));
		if (param.length <= maxChars) return {
			param,
			dropped,
			shortened
		};
		dropped.push(+entries.pop()[0]);
	}

		param: "",
		dropped,
		shortened
	};
}
function decodeNotesParam(param) {
	try {
		const obj = JSON.parse(b64u.decode(param));
		if (!obj || typeof obj !== "object" || Array.isArray(obj)) return {};
		return cleanNotes(obj);
	} catch (e) {
		return {};
	}
}

//#region src/core/carry.js
var nums = (list) => (list || []).map((n) => String(n).trim()).filter((s) => /^\d+$/.test(s)).map(Number);
var dec = (s) => {
	try {
		return decodeURIComponent(s);
	} catch (e) {
		return "";
	}
};
function parseVerdicts(param) {
	return Object.fromEntries(String(param || "").split(";").map((pair) => {
		const i = pair.indexOf(":");
		return i < 0 ? null : [pair.slice(0, i).trim(), pair.slice(i + 1)];
	}).filter((p) => p && /^\d+$/.test(p[0]) && p[1]).map(([no, who]) => [+no, dec(who)]).filter(([, who]) => who));
}
var encodeVerdicts = (verdicts) => Object.entries(verdicts || {}).map(([no, who]) => no + ":" + encodeURIComponent(who)).join(";");
function mergeCarry(local, incoming) {
	const picks = [.../* @__PURE__ */ new Set([...nums(local && local.picks), ...nums(incoming && incoming.picks)])];
	const verdicts = {
		...incoming && incoming.verdicts || {},
		...local && local.verdicts || {}
	};
	const notes = { ...local && local.notes || {} };
	for (const [no, t] of Object.entries(incoming && incoming.notes || {})) notes[no] = mergeNoteText(notes[no], t);
	return {
		picks,
		verdicts,
		notes
	};

//#region move/main.js
(function() {
	if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
	if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
	const NEW = "https://how-the-light-gets-in.firebaseapp.com/";
	const a = document.getElementById("new");
	a.href = NEW;
	a.textContent = NEW.replace(/^https:\/\//, "").replace(/\/$/, "");
	const load = (k) => {
		try {
			return JSON.parse(localStorage.getItem(k));
		} catch (e) {
			return null;
		}
	};
	const picks = (load("htlgi-l26-picks") || []).filter((n) => Number.isInteger(n));
	const verdicts = load("htlgi-l26-verdicts") || {};
	const notes = load("htlgi-l26-notes") || {};
	if (!(picks.length || Object.keys(verdicts).length || Object.values(notes).some((t) => t && t.trim()))) {
		location.replace(NEW + location.hash);
		return;
	}
	const inc = location.hash.match(/picks=([\d,]*)/);
	const incV = location.hash.match(/verdicts=([^&]+)/);
	const incN = location.hash.match(/notes=([^&]+)/);
	const ev = location.hash.match(/event=(\d+)/);
	const carried = mergeCarry({
		picks,
		verdicts,
		notes
	}, {
		picks: inc ? inc[1].split(",") : [],
		verdicts: incV ? parseVerdicts(incV[1]) : {},
		notes: incN ? decodeNotesParam(incN[1]) : {}
	});
	const { param: p, dropped: droppedList, shortened } = encodeNotesParam(carried.notes, 3e4);
	const dropped = droppedList.length;
	const v = encodeVerdicts(carried.verdicts);
	const link = NEW + "#picks=" + carried.picks.join(",") + (v ? "&verdicts=" + v : "") + (p ? "&notes=" + p : "") + (ev ? "&event=" + ev[1] : "");
	document.getElementById("carry").hidden = false;
	document.getElementById("go").hidden = false;
	const problems = [];
	if (dropped) problems.push(dropped + " long note" + (dropped === 1 ? "" : "s") + " will not fit in the link");
	if (shortened) problems.push(shortened + " very long note" + (shortened === 1 ? "" : "s") + " will be shortened to 20000 characters");
	if (problems.length) {
		const w = document.getElementById("warn");
		w.hidden = false;
		w.textContent = problems.join("; ") + "; export your notes (.md) from the old planner first if you need them in full.";
	}
	document.getElementById("btn").addEventListener("click", () => {
		location.href = link;
	});
})();
